name: Foundation Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate
      - name: Validate foundation
        run: npm run check
      - name: Export Android and Apple bundles
        run: npm run test:integration
      - name: Validate research catalog generator syntax
        run: node --check product/scripts/catalog-support.mjs
